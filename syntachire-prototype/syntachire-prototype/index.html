<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyntacHire AI — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0f1b3d;
  --blue-800:#14204a;
  --blue-700:#1d3a8f;
  --blue-600:#2648d6;
  --blue-500:#2f5be0;
  --blue-400:#5b7cf0;
  --blue-100:#e7ecfd;
  --blue-50:#f1f4fe;
  --ink-900:#0e1220;
  --ink-700:#3a3f52;
  --ink-500:#6b7086;
  --ink-300:#9aa0b4;
  --line:#e4e7f2;
  --bg:#f4f6fc;
  --card:#ffffff;
  --green:#1a9c62;
  --green-bg:#e5f7ee;
  --amber:#c98a1a;
  --amber-bg:#fdf3e2;
  --red:#d64545;
  --red-bg:#fdeaea;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(15,27,61,0.06);
  --shadow-md:0 8px 24px rgba(15,27,61,0.08);
  --shadow-lg:0 20px 48px rgba(15,27,61,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
ul{list-style:none;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- utility ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:10px;font-size:14.5px;font-weight:600;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--blue-600);color:#fff;box-shadow:0 6px 16px rgba(38,72,214,0.28);}
.btn-primary:hover{background:var(--blue-500);box-shadow:0 8px 22px rgba(38,72,214,0.36);}
.btn-secondary{background:#fff;color:var(--ink-900);border:1px solid var(--line);}
.btn-secondary:hover{border-color:var(--blue-400);color:var(--blue-600);}
.btn-outline-red{background:#fff;color:var(--red);border:1px solid #f2c6c6;}
.btn-outline-red:hover{background:var(--red-bg);}
.btn-ghost{background:transparent;color:var(--blue-600);font-weight:600;}
.btn-block{width:100%;}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}

/* ---------- app pages toggle ---------- */
.page{display:none;}
.page.active{display:block;}

/* scrollbar tidy */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#cfd6ea;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* focus visibility for a11y */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--blue-500); outline-offset:2px; border-radius:6px;
}

/* ---------- Proto switcher (dev nav, not part of the design) ---------- */
.proto-switcher{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  z-index:999; display:flex; gap:6px; background:var(--blue-900);
  padding:8px; border-radius:14px; box-shadow:var(--shadow-lg);
}
.proto-switcher button{
  padding:9px 14px; border-radius:9px; font-size:12.5px; font-weight:600;
  color:#b9c3e6; transition:.15s;
}
.proto-switcher button.active{background:var(--blue-600); color:#fff;}
.proto-switcher button:hover:not(.active){background:rgba(255,255,255,0.08); color:#fff;}

/* ================= APP SHELL (sidebar + topbar) shared by dashboard/resume/interview/coding ================= */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:264px; flex-shrink:0; background:#fff; border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:24px 18px; position:sticky; top:0; height:100vh;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px;}
.brand-mark{
  width:38px; height:38px; border-radius:10px; background:var(--blue-600);
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
}
.brand-text .name{font-weight:800; font-size:16.5px; color:var(--blue-700); line-height:1.2;}
.brand-text .tag{font-size:11.5px; color:var(--ink-500); font-weight:500;}
.nav-group{display:flex; flex-direction:column; gap:2px; margin-bottom:8px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px;
  font-size:14.5px; font-weight:500; color:var(--ink-700); transition:.15s;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--blue-50); color:var(--blue-600);}
.nav-item.active{background:var(--blue-600); color:#fff; font-weight:600;}
.sidebar-spacer{flex:1;}
.upgrade-card{
  background:var(--blue-50); border-radius:var(--radius-md); padding:16px; margin:10px 0 16px;
}
.upgrade-card .t{font-weight:700; color:var(--blue-700); font-size:14px; margin-bottom:6px;}
.upgrade-card .d{font-size:12.5px; color:var(--ink-500); line-height:1.5; margin-bottom:12px;}
.sidebar-foot{border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:2px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 32px; border-bottom:1px solid var(--line); background:#fff;
}
.topbar h1{font-size:22px; font-weight:700;}
.topbar .sub{font-size:13px; color:var(--ink-500); margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:16px;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--ink-500); transition:.15s;
}
.icon-btn:hover{background:var(--blue-50); color:var(--blue-600);}
.avatar{
  width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--blue-400),var(--blue-700));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
}
.content{padding:28px 32px; flex:1;}
.app-footer{padding:20px 32px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-500); background:#fff;}
.app-footer .brand{font-weight:800; color:var(--blue-700); font-size:14px; margin-bottom:2px;}
.app-footer nav{display:flex; gap:22px;}

@media (max-width:960px){
  .sidebar{display:none;}
  .content{padding:20px;}
  .topbar{padding:16px 20px;}
}

/* ================= LANDING PAGE ================= */
.lp-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 48px; background:#fff; border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
.lp-logo{font-weight:800; font-size:19px; color:var(--blue-700); letter-spacing:-.2px;}
.lp-links{display:flex; align-items:center; gap:32px;}
.lp-links a{font-size:14.5px; font-weight:500; color:var(--ink-700); padding-bottom:4px; border-bottom:2px solid transparent;}
.lp-links a.active{color:var(--blue-600); border-color:var(--blue-600); font-weight:600;}
.lp-nav-right{display:flex; align-items:center; gap:14px;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line);
  border-radius:9px; padding:9px 14px; font-size:13.5px; color:var(--ink-300); width:190px;
}

.hero{padding:88px 48px 60px; background:linear-gradient(180deg,#fff 0%, var(--bg) 100%);}
.hero-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:56px; align-items:center; max-width:1280px; margin:0 auto;}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:7px; background:var(--blue-50); color:var(--blue-600);
  padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; margin-bottom:22px;
}
.hero h1{font-size:52px; line-height:1.08; font-weight:800; letter-spacing:-1.2px; margin-bottom:20px;}
.hero h1 .accent{color:var(--blue-600);}
.hero p{font-size:16px; line-height:1.65; color:var(--ink-500); max-width:480px; margin-bottom:30px;}
.hero-ctas{display:flex; gap:14px; margin-bottom:26px;}
.hero-social{display:flex; align-items:center; gap:12px;}
.avatar-stack{display:flex;}
.avatar-stack span{
  width:30px; height:30px; border-radius:50%; border:2px solid #fff; margin-left:-8px;
  background:linear-gradient(135deg,var(--blue-400),var(--blue-700));
}
.avatar-stack span:first-child{margin-left:0;}
.hero-social small{font-size:13px; color:var(--ink-500);}

.hero-visual{position:relative;}
.hero-shot{
  border-radius:18px; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--line);
  background:#0c1330;
}
.hero-shot img{display:block; width:100%;}
.floating-card{
  position:absolute; right:-18px; bottom:-26px; background:#fff; border-radius:14px;
  box-shadow:var(--shadow-lg); padding:14px 16px; display:flex; gap:10px; align-items:flex-start;
  width:230px; border:1px solid var(--line);
}
.floating-card .dot{
  width:30px; height:30px; border-radius:50%; background:var(--green-bg); color:var(--green);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.floating-card .ft{font-size:12.5px; font-weight:700; margin-bottom:2px;}
.floating-card .fd{font-size:11.5px; color:var(--ink-500); line-height:1.4;}

.section{max-width:1280px; margin:0 auto; padding:90px 48px;}
.section-head{text-align:center; max-width:640px; margin:0 auto 52px;}
.section-head h2{font-size:34px; font-weight:800; letter-spacing:-.6px; margin-bottom:14px;}
.section-head p{color:var(--ink-500); font-size:15.5px; line-height:1.6;}

.feature-grid{display:grid; grid-template-columns:1.3fr 1fr; grid-template-rows:auto auto; gap:20px;}
.feature-card{border-radius:var(--radius-lg); padding:30px; position:relative; overflow:hidden; min-height:190px;}
.feature-card.light{background:#fff; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
.feature-card.dark{background:var(--blue-600); color:#fff;}
.feature-card.tint{background:var(--blue-50); border:1px solid var(--blue-100);}
.feature-icon{
  width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  margin-bottom:16px; background:var(--blue-50); color:var(--blue-600);
}
.feature-card.dark .feature-icon{background:rgba(255,255,255,0.16); color:#fff;}
.feature-card h3{font-size:19px; font-weight:700; margin-bottom:8px;}
.feature-card p{font-size:13.8px; line-height:1.55; color:var(--ink-500); max-width:340px;}
.feature-card.dark p{color:rgba(255,255,255,0.85);}
.feature-link{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--blue-600); margin-top:12px;}
.tag-row{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
.tag-row span{background:var(--bg); border:1px solid var(--line); font-size:11.5px; padding:5px 10px; border-radius:7px; color:var(--ink-500); font-weight:600;}
.code-preview{
  background:#0c1330; border-radius:12px; padding:16px 18px; font-family:'JetBrains Mono',monospace;
  font-size:12px; line-height:1.7; color:#c9d3f5; margin-top:16px;
}
.code-preview .kw{color:#7aa2ff;} .code-preview .fn{color:#8fe3b0;} .code-preview .cm{color:#6b7398;}
.dots{display:flex; gap:6px; margin-bottom:10px;}
.dots span{width:9px; height:9px; border-radius:50%;}
.dots span:nth-child(1){background:#e6685a;} .dots span:nth-child(2){background:#e0b23c;} .dots span:nth-child(3){background:#54c47a;}

.process-band{background:var(--bg); padding:90px 48px;}
.process-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:32px; max-width:1100px; margin:0 auto 46px; text-align:center;}
.process-step .num-circle{
  width:58px; height:58px; border-radius:50%; background:#fff; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:var(--blue-600);
  box-shadow:var(--shadow-sm);
}
.process-step:last-child .num-circle{background:var(--blue-600); color:#fff; border-color:var(--blue-600);}
.process-step h4{font-size:16px; font-weight:700; margin-bottom:8px;}
.process-step p{font-size:13.5px; color:var(--ink-500); line-height:1.55;}
.process-cta{display:flex; justify-content:center;}

.stats-band{background:var(--blue-900); padding:64px 48px;}
.stats-grid{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); text-align:center;}
.stats-grid .num{font-size:38px; font-weight:800; color:#fff; letter-spacing:-1px;}
.stats-grid .lbl{font-size:13px; color:#8f9ac2; margin-top:6px;}

.lp-footer{background:var(--blue-50); padding:36px 48px; display:flex; align-items:center; justify-content:space-between;}
.lp-footer .brand{font-weight:800; color:var(--blue-700); font-size:17px; margin-bottom:4px;}
.lp-footer p{font-size:12.5px; color:var(--ink-500);}
.lp-footer nav{display:flex; gap:24px; font-size:13px; color:var(--ink-700); font-weight:500;}
.lp-footer-icons{display:flex; gap:10px;}
.lp-footer-icons span{
  width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--ink-500);
}

@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;}
  .feature-grid{grid-template-columns:1fr;}
  .process-steps{grid-template-columns:repeat(2,1fr);}
  .stats-grid{grid-template-columns:repeat(2,1fr); gap:28px;}
  .lp-links{display:none;}
  .lp-footer{flex-direction:column; gap:18px; text-align:center;}
}

/* ================= DASHBOARD ================= */
.dash-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:20px;}
.hero-insight{
  background:linear-gradient(135deg,#fbfcff,var(--blue-50)); padding:32px; position:relative; overflow:hidden;
}
.insight-eyebrow{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--blue-600); margin-bottom:14px; letter-spacing:.3px;}
.hero-insight h2{font-size:26px; font-weight:800; margin-bottom:10px;}
.hero-insight p{font-size:14px; color:var(--ink-500); max-width:440px; line-height:1.55; margin-bottom:22px;}
.score-row{display:flex; align-items:flex-end; justify-content:space-between;}
.score-big{font-size:52px; font-weight:800; color:var(--blue-700); line-height:1;}
.score-big span{font-size:22px; font-weight:700;}
.score-delta{font-size:12.5px; color:var(--green); font-weight:600; margin-top:6px;}
.quick-links{display:flex; flex-direction:column; gap:14px;}
.quick-link{
  display:flex; align-items:center; gap:14px; padding:16px; cursor:pointer; transition:.15s;
}
.quick-link:hover{border-color:var(--blue-400); box-shadow:var(--shadow-md);}
.quick-link .qi{width:42px; height:42px; border-radius:10px; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.quick-link .qt{font-size:14.5px; font-weight:700;}
.quick-link .qd{font-size:12px; color:var(--ink-500); margin-top:2px;}

.stat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px;}
.stat-card{padding:26px;}
.stat-card .st-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
.stat-card .st-label{font-size:14px; color:var(--ink-500); font-weight:600;}
.stat-card .st-icon{width:34px; height:34px; border-radius:9px; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center;}
.stat-card .st-num{font-size:34px; font-weight:800; margin-bottom:16px;}
.bar-track{height:7px; border-radius:99px; background:var(--bg); overflow:hidden; margin-bottom:8px;}
.bar-fill{height:100%; border-radius:99px; background:var(--blue-600);}
.bar-fill.green{background:var(--green);}
.st-foot{font-size:12px; color:var(--ink-500); font-weight:600;}
.radar-wrap{display:flex; flex-direction:column; align-items:center;}
.radar-legend{display:flex; gap:16px; font-size:11.5px; color:var(--ink-500); margin-top:6px;}
.radar-legend span{display:inline-flex; align-items:center; gap:5px;}
.dotlg{width:8px; height:8px; border-radius:50%; display:inline-block;}

.bottom-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:22px 24px 6px;}
.panel-head h3{font-size:16.5px; font-weight:700;}
.panel-head a{font-size:13px; font-weight:600; color:var(--blue-600);}
.activity-list{padding:6px 10px 18px;}
.activity-row{display:flex; align-items:center; gap:14px; padding:14px; border-radius:12px;}
.activity-row:hover{background:var(--bg);}
.act-icon{width:38px; height:38px; border-radius:10px; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.act-body{flex:1; min-width:0;}
.act-title{font-size:14px; font-weight:700;}
.act-sub{font-size:12px; color:var(--ink-500); margin-top:2px;}
.act-right{text-align:right; flex-shrink:0;}
.act-time{font-size:11.5px; color:var(--ink-300);}
.act-status{font-size:12px; font-weight:700; margin-top:3px;}
.act-status.good{color:var(--green);}

.coach-card{padding:22px; margin-bottom:20px;}
.coach-head{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--blue-600); margin-bottom:14px;}
.coach-card h4{font-size:16px; font-weight:700; margin-bottom:10px;}
.coach-card p{font-size:13px; color:var(--ink-500); line-height:1.55; margin-bottom:16px;}
.report-card{background:var(--blue-50); border:1px solid var(--blue-100); padding:18px; display:flex; gap:14px; align-items:center;}
.report-card .ricon{width:44px; height:44px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow-sm);}
.report-card .rt{font-size:13.5px; font-weight:700; margin-bottom:3px;}
.report-card .rd{font-size:12px; color:var(--ink-500); line-height:1.4;}

/* ================= RESUME ANALYZER ================= */
.resume-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px;}
.dropzone{
  border:2px dashed #c9d1ea; border-radius:14px; padding:70px 30px; text-align:center; background:#fbfcff;
  transition:.2s;
}
.dropzone.drag{border-color:var(--blue-500); background:var(--blue-50);}
.dz-icon{width:64px; height:64px; border-radius:16px; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center; margin:0 auto 22px;}
.dropzone h2{font-size:24px; font-weight:800; margin-bottom:10px;}
.dropzone p{font-size:14px; color:var(--ink-500); margin-bottom:22px;}
.dz-max{font-size:11px; color:var(--ink-300); font-weight:700; letter-spacing:.5px; margin-top:16px;}
.tip-card{padding:22px; margin-bottom:20px;}
.tip-head{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:12px;}
.tip-card p{font-size:13.5px; color:var(--ink-500); line-height:1.6;}
.tip-card em{color:var(--blue-600); font-style:normal; font-weight:600;}
.tip-card a{font-size:13px; font-weight:600; color:var(--blue-600); display:inline-block; margin-top:12px;}
.pathing-card{padding:22px;}
.pathing-card h4{font-size:16px; font-weight:800; color:var(--blue-700); margin-bottom:10px;}
.pathing-card p{font-size:13.5px; color:var(--ink-500); line-height:1.6;}
.file-progress{display:none; margin-top:22px; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px;}
.file-progress.show{display:block;}
.fp-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.fp-icon{width:36px; height:36px; border-radius:9px; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.fp-name{font-size:13.5px; font-weight:700;}
.fp-size{font-size:11.5px; color:var(--ink-500);}

/* ================= MOCK INTERVIEW ================= */
.interview-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px;}
.session-tag{display:flex; align-items:center; gap:12px; margin-bottom:0;}
.live-dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.video-frame{border-radius:16px; overflow:hidden; position:relative; background:#0c1330; aspect-ratio:16/8.4;}
.video-frame img{width:100%; height:100%; object-fit:cover; opacity:.92;}
.rec-badge{position:absolute; top:16px; left:16px; background:rgba(0,0,0,0.55); color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; display:flex; align-items:center; gap:6px;}
.rec-badge .reddot{width:8px; height:8px; border-radius:2px; background:#e6453b;}
.prompt-box{
  position:absolute; left:20px; right:20px; bottom:20px; background:rgba(255,255,255,0.96);
  border-radius:12px; padding:16px 18px; border:1px solid rgba(255,255,255,0.5); box-shadow:var(--shadow-lg);
}
.prompt-eyebrow{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--blue-600); margin-bottom:8px; letter-spacing:.3px;}
.prompt-box .q{font-size:19px; font-weight:700; line-height:1.35;}
.response-card{padding:20px; margin-top:20px;}
.resp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.resp-head .rl{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700;}
.resp-head .rmeta{font-size:12.5px; color:var(--ink-500);}
textarea.response-input{
  width:100%; min-height:100px; border:none; resize:vertical; font-family:inherit; font-size:14.5px;
  color:var(--ink-900); line-height:1.6;
}
textarea.response-input::placeholder{color:var(--ink-300);}
textarea.response-input:focus{outline:none;}
.resp-foot{display:flex; align-items:center; justify-content:flex-end; gap:12px; border-top:1px solid var(--line); margin:14px -20px -20px; padding:16px 20px;}

.progress-card{padding:22px;}
.progress-top{display:flex; justify-content:space-between; margin-bottom:14px;}
.progress-top .l{font-size:12.5px; color:var(--ink-500); font-weight:600;}
.progress-top .v{font-size:20px; font-weight:800; margin-top:4px;}
.progress-top .v span{color:var(--ink-300); font-size:13px; font-weight:600;}
.stage-row{display:flex; align-items:center; justify-content:space-between; margin-top:16px; font-size:12.5px; font-weight:600;}
.stage-row .done{color:var(--green); display:flex; align-items:center; gap:6px;}
.stage-row .cur{color:var(--blue-600); display:flex; align-items:center; gap:6px;}

.insights-card{padding:22px; margin-top:20px;}
.insights-head{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--blue-600); margin-bottom:18px; letter-spacing:.3px;}
.metric-row{margin-bottom:16px;}
.metric-top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:8px;}
.metric-top .mv{font-weight:700; color:var(--ink-700);}
.chip{font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px;}
.chip.pos{background:var(--green-bg); color:var(--green);}
.chip.good{background:var(--blue-50); color:var(--blue-600);}
.hint-box{background:var(--blue-50); border-radius:12px; padding:14px; display:flex; gap:10px; margin-top:6px;}
.hint-box p{font-size:12.5px; color:var(--ink-700); line-height:1.55; font-style:italic;}
.score-ring-wrap{margin-top:20px; text-align:center;}
.score-ring-wrap .lbl{font-size:12.5px; color:var(--ink-500); font-weight:600; margin-bottom:14px;}

/* ================= CODING HUB ================= */
.coding-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px;}
.seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:4px;}
.seg button{padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-500);}
.seg button.active{background:#fff; color:var(--ink-900); box-shadow:var(--shadow-sm);}
.coding-stat-grid{display:grid; grid-template-columns:1fr 1.3fr 1.3fr; gap:20px; margin-bottom:20px;}
.solved-card{padding:24px;}
.solved-card .lbl{font-size:12px; font-weight:700; color:var(--ink-500); letter-spacing:.4px; margin-bottom:10px;}
.solved-card .num{font-size:44px; font-weight:800; margin-bottom:14px;}
.solved-card .delta{font-size:12.5px; color:var(--green); font-weight:700; display:flex; align-items:center; gap:5px;}
.breakdown-card{padding:24px;}
.breakdown-card .lbl{font-size:12px; font-weight:700; color:var(--ink-500); letter-spacing:.4px; margin-bottom:16px;}
.bd-row{margin-bottom:14px;}
.bd-top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; font-weight:600;}
.bd-top span:last-child{color:var(--ink-500); font-weight:600;}
.pick-card{padding:22px; background:linear-gradient(160deg,#fff,var(--blue-50));}
.pick-eyebrow{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--blue-600); margin-bottom:10px;}
.pick-card p{font-size:13px; color:var(--ink-500); line-height:1.55; margin-bottom:14px;}
.pick-card p em{font-style:normal; font-weight:700; color:var(--ink-900);}
.pick-problem{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px;}
.pick-problem .pr-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.diff-badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:5px; letter-spacing:.3px;}
.diff-badge.hard{background:var(--red-bg); color:var(--red);}
.diff-badge.medium{background:var(--amber-bg); color:var(--amber);}
.diff-badge.easy{background:var(--green-bg); color:var(--green);}
.pick-problem .pt{font-size:14px; font-weight:700;}
.pick-problem .ps{font-size:12px; color:var(--ink-500); margin-top:4px;}

.filter-card{padding:20px 24px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:16px;}
.filter-group{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.filter-group .fl{font-size:12.5px; color:var(--ink-500); font-weight:700;}
.chip-btn{padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid var(--line); color:var(--ink-700); background:#fff; display:inline-flex; align-items:center; gap:6px;}
.chip-btn.active{background:var(--blue-600); color:#fff; border-color:var(--blue-600);}
.chip-btn .sdot{width:7px; height:7px; border-radius:50%;}
.search-input{
  display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px; padding:9px 14px;
  font-size:13.5px; color:var(--ink-300); background:#fff; min-width:220px;
}
.search-input input{border:none; outline:none; font-size:13.5px; width:100%; color:var(--ink-900);}

.problems-table{width:100%; border-collapse:collapse;}
.problems-table th{text-align:left; font-size:11.5px; font-weight:700; color:var(--ink-500); letter-spacing:.4px; padding:16px 20px; border-bottom:1px solid var(--line);}
.problems-table td{padding:18px 20px; border-bottom:1px solid var(--line); vertical-align:middle;}
.problems-table tr:last-child td{border-bottom:none;}
.prob-name{font-size:14.5px; font-weight:700;}
.prob-desc{font-size:12.5px; color:var(--ink-500); margin-top:3px;}
.status-check{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.status-check.done{background:var(--green-bg); color:var(--green);}
.status-check.todo{border:2px solid var(--line);}
.table-foot{display:flex; align-items:center; justify-content:space-between; padding:16px 20px;}
.table-foot .tf-l{font-size:12.5px; color:var(--ink-500);}
.pager{display:flex; align-items:center; gap:6px;}
.pager button{width:30px; height:30px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink-500); display:flex; align-items:center; justify-content:center;}
.pager button.active{background:var(--blue-600); color:#fff;}

.promo-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
.streak-card{background:var(--blue-900); border-radius:16px; padding:26px; color:#fff;}
.streak-tag{display:inline-block; background:rgba(255,255,255,0.14); font-size:11px; font-weight:700; padding:5px 11px; border-radius:6px; margin-bottom:14px; letter-spacing:.3px;}
.streak-card h4{font-size:20px; font-weight:800; margin-bottom:8px;}
.streak-card p{font-size:13.5px; color:#aab3d6; margin-bottom:18px; max-width:320px; line-height:1.55;}
.streak-foot{display:flex; align-items:center; gap:16px;}
.streak-foot small{font-size:12px; color:#8f9ac2;}
.session-card{border-radius:16px; overflow:hidden; position:relative; min-height:190px; display:flex; align-items:flex-end;}
.session-card img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.session-card::after{content:"";position:absolute; inset:0; background:linear-gradient(180deg,rgba(12,19,48,0.1),rgba(12,19,48,0.88));}
.session-card .sc-body{position:relative; padding:22px; color:#fff;}
.session-card .sc-tag{font-size:11.5px; font-weight:700; color:#9fb0ff; margin-bottom:6px; letter-spacing:.3px;}
.session-card h4{font-size:17px; font-weight:800; margin-bottom:6px;}
.session-card p{font-size:13px; color:#d3d9f4; margin-bottom:12px;}
.session-card a{font-size:13px; font-weight:700; color:#fff; display:inline-flex; align-items:center; gap:5px;}

@media (max-width:1100px){
  .dash-grid, .stat-row, .bottom-grid, .resume-grid, .interview-grid, .coding-stat-grid, .promo-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ============ PAGE 1: LANDING ============ -->
<div class="page active" id="page-landing"></div>

<!-- ============ PAGE 2: DASHBOARD ============ -->
<div class="page" id="page-dashboard"></div>

<!-- ============ PAGE 3: RESUME ANALYZER ============ -->
<div class="page" id="page-resume"></div>

<!-- ============ PAGE 4: MOCK INTERVIEW ============ -->
<div class="page" id="page-interview"></div>

<!-- ============ PAGE 5: CODING HUB ============ -->
<div class="page" id="page-coding"></div>

<!-- ============ PROTO SWITCHER ============ -->
<nav class="proto-switcher" aria-label="Prototype page switcher">
  <button data-page="landing" class="active">Landing</button>
  <button data-page="dashboard">Dashboard</button>
  <button data-page="resume">Resume</button>
  <button data-page="interview">Interview</button>
  <button data-page="coding">Coding Hub</button>
</nav>

<script src="app.js"></script>
</body>
</html>
